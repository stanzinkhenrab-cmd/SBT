name: iOS build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check the project file matches the source tree
        run: |
          python3 tools/generate_xcodeproj.py
          if ! git diff --quiet -- SeabuckthornSurvey.xcodeproj; then
            echo "::error::SeabuckthornSurvey.xcodeproj is out of date."
            echo "Run 'python3 ios/tools/generate_xcodeproj.py' and commit the result."
            git diff -- SeabuckthornSurvey.xcodeproj
            exit 1
          fi

      - name: Pick a simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      raise SystemExit
          ')
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID" || true

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SeabuckthornSurvey.xcodeproj \
            -scheme SeabuckthornSurvey \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 120

      - name: Build for a device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SeabuckthornSurvey.xcodeproj \
            -scheme SeabuckthornSurvey \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 60

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
