splashscreen = "1.0.1"
appcompat = "1.7.0"
exifinterface = "1.3.7"
desugarJdkLibs = "2.0.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
