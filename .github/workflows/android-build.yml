name: Android build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest > test.log 2>&1; then
            echo "::group::Kotlin compiler errors"
            grep -E "^e: |^w: .*error" test.log || echo "(no compiler errors — see the tail below)"
            echo "::endgroup::"
            echo "::group::Failing tests"
            grep -E "FAILED|expected:|actual:|AssertionError|Caused by:" test.log | head -n 60 || true
            echo "::endgroup::"
            echo "::group::Output tail"
            tail -n 80 test.log
            echo "::endgroup::"
            exit 1
          fi
          grep -E "tests completed|BUILD SUCCESSFUL" test.log | tail -n 5

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: seabuckthorn-survey-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: seabuckthorn-survey-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
          if-no-files-found: ignore
